<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Soundproof Agent{% endblock %}</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
      .container { max-width: 1120px; margin: 0 auto; padding: 24px; }
      .card { background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
      h1, h2, h3 { color: #f8fafc; }
      a { color: #7dd3fc; text-decoration: none; }
      pre { white-space: pre-wrap; word-break: break-word; background: #020617; padding: 12px; border-radius: 8px; overflow: auto; }
      input, select, button { padding: 8px 10px; border-radius: 8px; border: 1px solid #475569; background: #0b1220; color: #e2e8f0; }
      button { cursor: pointer; background: #1d4ed8; border-color: #1d4ed8; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border-bottom: 1px solid #334155; padding: 8px; text-align: left; vertical-align: top; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
      .muted { color: #94a3b8; }
      .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #1e293b; color: #cbd5e1; font-size: 12px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      .footer { margin-top: 24px; color: #94a3b8; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="container">
      {% block content %}{% endblock %}
      <div class="footer">本页为开发态/联调态界面，后续会替换为正式产品页。</div>
    </div>
  </body>
</html>
